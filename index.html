<script>
const H=36e5,D=24*H,ST=['Aberto','Em atendimento','Aguardando','Encerrado'];

const ext=o=>o.type==='Backbone'&&o.owner!=='Própria';
const age=ms=>{const h=Math.floor(ms/H);return h>=24?`${Math.floor(h/24)}d ${h%24}h`:`${h}h ${Math.floor(ms%H/6e4)}min`};

function recur(){const m={};data.forEach(o=>{(o.type==='FTTH'?o.pons.split(',').map(p=>p.trim()).filter(Boolean).map(p=>`${o.route} · PON ${p}`):[o.route]).forEach(k=>{m[k]=m[k]||{k,n:0,r:o.route};m[k].n++})});return Object.values(m).sort((a,b)=>b.n-a.n)}
