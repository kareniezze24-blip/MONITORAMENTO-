<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de rompimentos</title>
<style>
:root{--bg:#f3f5f7;--sf:#fff;--tx:#14202b;--mu:#5b6b7a;--ln:#d9e0e6;--ac:#0a5c8f;--acx:#fff;--red:#b42318;--redb:#fde8e6;--amb:#9a5b00;--ambb:#fff1d6;--grn:#14693d;--grnb:#dff3e6;--blu:#0a5c8f;--blub:#e1eefa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--sf:#18222c;--tx:#e8eef3;--mu:#93a3b2;--ln:#2b3946;--ac:#5db4ea;--acx:#07151f;--red:#ff8a80;--redb:#3a1a18;--amb:#ffc266;--ambb:#352610;--grn:#6fd69a;--grnb:#12301f;--blu:#5db4ea;--blub:#112c40}}
:root[data-theme="dark"]{--bg:#0f161d;--sf:#18222c;--tx:#e8eef3;--mu:#93a3b2;--ln:#2b3946;--ac:#5db4ea;--acx:#07151f;--red:#ff8a80;--redb:#3a1a18;--amb:#ffc266;--ambb:#352610;--grn:#6fd69a;--grnb:#12301f;--blu:#5db4ea;--blub:#112c40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--sf);border-top:4px solid var(--ac);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0}.sub{color:var(--mu);font-size:13px}
select,input,textarea,button{font:inherit;color:var(--tx)}
select,input,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;width:100%}
.shell{display:flex}.content{flex:1;min-width:0}
nav{display:flex;flex-direction:column;gap:4px;padding:12px 8px;width:210px;flex:none;background:var(--sf);border-right:1px solid var(--ln)}
nav button{background:none;border:0;border-left:4px solid transparent;border-radius:6px;padding:10px 12px;cursor:pointer;color:var(--mu);text-align:left;font-weight:600}
nav button[aria-current="true"]{color:var(--ac);border-color:var(--ac);background:var(--blub)}
main,#bn{max-width:1000px;margin:0 auto;padding:16px}#bn{padding-bottom:0}
main h2{font-size:16px;margin:18px 0 8px}.panel h2{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:30px;line-height:1.1}.kpi span{color:var(--mu);font-size:13px}.kpi.r b{color:var(--red)}
.item{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--grn);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;width:100%}
.item.r{border-left-color:var(--red)}.item.a{border-left-color:var(--amb)}
.item:hover,.item:focus-visible,.rk:hover{outline:2px solid var(--ac)}
.item .t{font-weight:700}.item .m{color:var(--mu);font-size:13px;grid-column:1/-1}
.age{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}.r .age{color:var(--red)}.a .age{color:var(--amb)}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--blub);color:var(--blu)}
.tag.Encerrado{background:var(--grnb);color:var(--grn)}.tag.Aguardando{background:var(--ambb);color:var(--amb)}
.tag.k{background:var(--ln);color:var(--tx)}.tag.ok{background:var(--grnb);color:var(--grn)}.tag.ext,.tag.wt{background:var(--ambb);color:var(--amb)}.tag.late{background:var(--redb);color:var(--red)}.lt{color:var(--red)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:14px}
.okbox{background:var(--grnb);color:var(--grn);border-radius:6px;padding:8px 10px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}.btn.s{background:none;color:var(--ac);border:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.tl{border-left:2px solid var(--ln);margin:12px 0 0 6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}
.tl div:before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}.tl small{color:var(--mu)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.empty{color:var(--mu);padding:12px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{flex:1;min-width:130px}
.note{font-size:12px;color:var(--mu)}
.alert{background:var(--redb);color:var(--red);border:1px solid var(--red);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.alert.ok{background:var(--grnb);color:var(--grn);border-color:var(--grn)}
.chip{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:99px;padding:3px 10px;cursor:pointer;font-size:13px}.chip.n{border-style:dashed}
.bars{display:flex;gap:5px;align-items:flex-end;height:120px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bc small{color:var(--mu);font-size:11px}
.bc .b{width:100%;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.rk{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr auto auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;margin-bottom:6px;cursor:pointer}
.rk .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{background:var(--ln);height:8px;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
@media (max-width:700px){.shell{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:6px 8px}nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}nav button[aria-current="true"]{border-color:var(--ac)}}
.mt{font:12px sans-serif;fill:var(--tx)}.map{width:100%;height:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px}
.lg{display:flex;gap:6px 14px;flex-wrap:wrap;margin:10px 0;font-size:13px}.lg i{display:inline-block;width:22px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px}
.esc{border-collapse:collapse;font-size:12px}.esc th,.esc td{border:1px solid var(--ln);padding:0;text-align:center}.esc th{background:var(--bg);padding:3px 4px;font-weight:600}.esc th.we{color:var(--red)}
.esc .nm2{text-align:left;position:sticky;left:0;min-width:140px;white-space:nowrap;padding:4px 8px;z-index:1}
.ec{display:block;width:100%;min-width:30px;height:30px;border:0;background:none;cursor:pointer;font-weight:700;font-size:12px}
.c-D{background:#0a5c8f;color:#fff}.c-N{background:#5b3fa0;color:#fff}.c-S{background:#c27a00;color:#fff}.c-FE{background:#14693d;color:#fff}.c-F{color:var(--mu)}
.cv{font-size:11px;padding:3px!important}.cv.bad{background:var(--redb);color:var(--red);font-weight:700}.tot{padding:0 6px!important;font-weight:700}
.x{background:none;border:0;color:var(--mu);cursor:pointer}
.spd{background:var(--ambb)}.hd{cursor:pointer}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left}.tb tr[data-q]{cursor:pointer}.tb tr[data-q]:hover{background:var(--blub)}
</style>
</head>
<body>
<header><div><h1>Controle de rompimentos</h1><div class="sub">Protótipo com dados fictícios</div></div><div class="row" style="flex:0;margin:0"><button class="btn" id="newb">+ Novo rompimento</button><button class="btn s" id="reset">Restaurar exemplos</button></div></header>
<div class="shell"><nav id="nav"></nav><div class="content">
<div id="bn"></div>
<main id="app"></main></div></div>
<script>
const H=36e5,D=24*H,ST=['Aberto','Em atendimento','Aguardando','Encerrado'];
const SITES=['Agro Brasil','Cachoeiras de Macacu','Campo do Prado','Guapiaçu','Guapimirim','Japuiba','KM 70','Maraporã','Marubaí','Papucaia'];
const OLTS=['OLT - AGROBRASIL-01 - EST8','OLT - AGROBRASIL-02 - EST8','OLT - CACHOEIRAS - EST1','OLT - GUAPIACU - EST4','OLT - JAPUIBA - EST3','OLT - KM70 - EST2','OLT - MARAPORA - EST5','OLT - MARUBAI - EST7','OLT - PAPUCAIA - EST6'];
const CAUSES=['Rompimento por terceiros','Queda de poste','Vandalismo ou furto de cabo','Árvore sobre o cabo','Falha de equipamento','Não identificada'];
const ORI=['Alarme do NMS/Zabbix','Reclamação de cliente','Equipe de campo','Aviso de terceiro'];
const MET=['PON ou link online no NMS','Potência óptica ou OTDR dentro do padrão','Clientes voltaram a navegar','Confirmado pelo terceiro'];
const WAIT=['Material','Liberação ou acesso','Terceiro (A, C, K ou concessionária)','Clima ou segurança'];
const LIM=24,KEY='rompimentos-proto-v6',OWN=['Própria','K','C','A'];
let st={view:'dash',sel:null,win:12,q:'',fs:'',tp:''},data=[],me='',notified={};
const $=i=>document.getElementById(i),opts=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${x}</option>`).join('');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const last=o=>o.log[o.log.length-1],pend=()=>data.filter(o=>o.s!=='Encerrado').sort((a,b)=>a.opened-b.opened);
const ext=o=>o.type==='Backbone'&&o.owner!=='Própria';
const age=ms=>{const h=Math.floor(ms/H);return h>=24?`${Math.floor(h/24)}d ${h%24}h`:`${h}h ${Math.floor(ms%H/6e4)}min`};
const dt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const lv=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const cls=o=>o.s!=='Encerrado'&&Date.now()-o.opened>D?'r':'';
const tag=s=>`<span class="tag ${s.split(' ')[0]}">${s}</span>`;
const kind=o=>o.type==='Backbone'?`<span class="tag k">Backbone</span> <span class="tag ${ext(o)?'ext':'ok'}">${o.owner==='Própria'?'Própria':'Terceiro '+esc(o.owner)}</span>`:'<span class="tag k">FTTH</span>';
const late=o=>o.s!=='Encerrado'&&Date.now()-o.opened>LIM*H?'Mais de 1 dia aberto':'';
const extra=o=>{return esc(o.local)+'<br>'+(o.type==='FTTH'?`PON(s) fora: ${esc(o.pons)} · Clientes off: <b>${o.clients||0}</b>`:`Dono: ${esc(o.owner)}${o.ticket?' · chamado '+esc(o.ticket):''} · Rota alternativa: ${o.alt}`)+'<br>'};
function recur(){const m={};data.forEach(o=>{(o.type==='FTTH'?o.pons.split(',').map(p=>p.trim()).filter(Boolean).map(p=>`${o.route} · PON ${p}`):[o.route]).forEach(k=>{m[k]=m[k]||{k,n:0,r:o.route};m[k].n++})});return Object.values(m).sort((a,b)=>b.n-a.n)}

const hist=n=>[['Backbone','Guapimirim x Maraporã','Própria',12,6],['Backbone','Guapimirim x Maraporã','Própria',27,11],['Backbone','Guapimirim x Maraporã','Própria',41,5],['Backbone','Guapimirim x Maraporã','Própria',66,8],['Backbone','Campo do Prado x Japuiba','K',8,30],['Backbone','Campo do Prado x Japuiba','K',33,22],['Backbone','Campo do Prado x Japuiba','K',72,40],['Backbone','Japuiba x Marubaí','C',15,60],['Backbone','Japuiba x Marubaí','C',58,36],['Backbone','Cachoeiras de Macacu x Guapiaçu','A',47,14],['Backbone','Cachoeiras de Macacu x Guapiaçu','A',95,20],['FTTH',OLTS[6],'1/1/2',10,5],['FTTH',OLTS[6],'1/1/2',24,8],['FTTH',OLTS[6],'1/1/2',38,4],['FTTH',OLTS[6],'1/1/2',63,6],['FTTH',OLTS[3],'1/1/5',6,3],['FTTH',OLTS[3],'1/1/5',29,6],['FTTH',OLTS[3],'1/1/5',77,5],['FTTH',OLTS[5],'1/1/1',18,4],['FTTH',OLTS[5],'1/1/1',54,7],['FTTH',OLTS[2],'1/1/4',88,3]].map((x,i)=>{const t=n-x[3]*D,f=x[0]==='FTTH';return{id:900+i,type:x[0],route:x[1],owner:f?'':x[2],pons:f?x[2]:'',clients:f?30+i*7:0,alt:'Não',origin:ORI[0],by:'Histórico',local:'Registro histórico',cause:CAUSES[5],team:'-',impact:'-',s:'Encerrado',opened:t,log:[{t,who:'Histórico',s:'Aberto',txt:'Registro importado.'},{t:t+x[4]*H,who:'LG',s:'Encerrado',txt:'Encerrado.'}],close:{restored:t+x[4]*H,method:MET[0],validator:'LG',action:'Reparo executado.'}}});
function seed(){const n=Date.now(),R=[
{id:1041,type:'Backbone',route:'Guapimirim x Maraporã',owner:'Própria',alt:'Não',local:'Km 42 da estrada de acesso',cause:CAUSES[0],impact:'2 enlaces corporativos',team:'Equipe Fibra Norte',s:'Em atendimento',h:76,by:'K',lg:[[76,'K','Aberto','Alarme de perda de sinal. Trecho sem tráfego.'],[70,'J','Em atendimento','Equipe no local. Cabo rompido em dois pontos.'],[30,'M','Em atendimento','Fusões em andamento, 48 de 144 fibras prontas.']]},
{id:1043,type:'FTTH',route:OLTS[6],pons:'1/1/2, 1/1/3',clients:180,local:'Rua das Acácias, Maraporã',cause:CAUSES[1],team:'Equipe Campo 2',s:'Aguardando',wait:WAIT[0],h:31,by:'M',lg:[[31,'M','Aberto','Poste caído sobre o lance de fibra. 2 PONs fora.'],[22,'J','Aguardando','Falta cordoalha e poste. Concessionária avisada.']]},
{id:1045,type:'Backbone',route:'Campo do Prado x Japuiba',owner:'K',ticket:'K-48213',alt:'Sim',local:'Trecho de terceiro, perto do km 12',cause:CAUSES[2],impact:'Sem queda de cliente',team:'K',s:'Aguardando',wait:WAIT[2],h:14,by:'J',lg:[[14,'J','Aberto','Alarme de atenuação. Chamado aberto no terceiro K.'],[6,'J','Aguardando','Terceiro K sem previsão de reparo.']]},
{id:1046,type:'FTTH',route:OLTS[3],pons:'1/1/5',clients:64,local:'Bairro Guapiaçu',cause:CAUSES[3],team:'Equipe Fibra Sul',s:'Aberto',h:3,by:'K',lg:[[3,'K','Aberto','PON 1/1/5 fora. Equipe sendo acionada.']]},
{id:1047,type:'Backbone',route:'Japuiba x Marubaí',owner:'C',ticket:'C-0917',alt:'Não',local:'Travessia da ponte',cause:CAUSES[4],impact:'Enlace corporativo',team:'C',s:'Aberto',h:52,by:'M',lg:[[52,'M','Aberto','Aguardando posição do terceiro C.'],[20,'K','Aberto','Cobrado novamente, sem previsão.']]},
{id:1040,type:'Backbone',route:'Agro Brasil x Papucaia',owner:'Própria',alt:'Não',local:'Ponte do rio, Papucaia',cause:CAUSES[0],team:'Equipe Fibra Norte',s:'Encerrado',h:52,by:'M',lg:[[52,'M','Aberto','Obra rompeu o duto.'],[8,'LG','Encerrado','Reparo concluído e validado.']],c:[9,1,'LG','Emendas refeitas e duto recomposto.']},
{id:1044,type:'FTTH',route:OLTS[5],pons:'1/1/1',clients:0,local:'Rua do Porto, km 70',cause:CAUSES[4],team:'Equipe Campo 2',s:'Encerrado',h:9,by:'J',lg:[[9,'J','Aberto','PON 1/1/1 fora. 40 clientes off.'],[4,'J','Encerrado','Placa reiniciada.']],c:[4,0,'J','Placa reiniciada, PON voltou online.']}];
return R.map(r=>({origin:ORI[0],team:'-',impact:'-',...r,opened:n-r.h*H,log:r.lg.map(l=>({t:n-l[0]*H,who:l[1],s:l[2],txt:l[3]})),close:r.c?{restored:n-r.c[0]*H,method:MET[r.c[1]],validator:r.c[2],action:r.c[3]}:null})).concat(hist(n))}
const load=()=>{try{const r=localStorage.getItem(KEY);if(r){data=JSON.parse(r);return}}catch(e){}data=seed()};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};

const card=o=>`<button class="item ${cls(o)}" data-id="${o.id}"><span class="t">#${o.id} · ${esc(o.route)}</span><span class="age">${age(dur(o))}</span><span class="m">${tag(o.s)} ${kind(o)}<br>${extra(o)}<small>Aberto por ${esc(o.by)} · última atualização: ${esc(last(o).who)}, ${dt(last(o).t)}</small></span></button>`;
function detail(){const o=data.find(x=>x.id===st.sel);if(!o)return '';
 const tl=[...o.log].reverse().map(l=>`<div><b>${l.s}</b> <small>${dt(l.t)} · ${esc(l.who)}${l.why?' · '+esc(l.why):''}</small><br>${esc(l.txt)}</div>`).join('');
 const c=o.close?`<p class="okbox">Serviço restabelecido em <b>${dt(o.close.restored)}</b>. Validado por ${esc(o.close.validator)}: ${esc(o.close.method)}.<br>Ação: ${esc(o.close.action)}</p>`:'';
 return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>#${o.id} · ${esc(o.route)}</h2><button class="btn s" id="close" style="flex:0">Fechar</button></div>
 <p>${tag(o.s)}${o.wait&&o.s==='Aguardando'?` <span class="tag wt">${esc(o.wait)}</span>`:''} ${kind(o)}<br>${o.s==='Encerrado'?'Ficou down por':'Início há'} <b>${age(dur(o))}</b> · aberto por ${esc(o.by)} · ${esc(o.origin)}<br><span class="sub">${extra(o)}Causa: ${esc(o.cause)} · Equipe: ${esc(o.team)}</span></p>${c}
 <div class="grid"><div><label>Quem atualizou *</label><input id="uw" value="${esc(me)}"></div><div><label>Novo status</label><select id="ns">${opts(ST,o.s)}</select></div>
 ${o.type==='FTTH'?`<div><label>Clientes off agora</label><input id="nc" type="number" min="0" value="${o.clients||0}"></div>`:''}
 <div id="bw"><label>Aguardando o quê?</label><select id="nw">${opts(WAIT,o.wait)}</select></div>
 <div id="bc" class="grid" style="grid-column:1/-1"><div><label>Serviço restabelecido às *</label><input id="cr" type="datetime-local" value="${lv(Date.now())}"></div><div><label>Como foi validado *</label><select id="cm">${opts(MET)}</select></div><div><label>Quem validou *</label><input id="cv"></div><div><label>Ação realizada *</label><input id="ca"></div></div>
 <div style="grid-column:1/-1"><label>Observação *</label><textarea id="nt" rows="2" placeholder="O que foi feito e o que falta"></textarea></div></div>
 <div class="row" style="margin-top:10px"><button class="btn" id="add" style="flex:0">Registrar atualização</button></div><div class="tl">${tl}</div></div>`}
function wireDetail(){if(!$('close'))return;$('close').onclick=()=>{st.sel=null;render()};
 const tg=()=>{const s=$('ns').value;$('bw').style.display=s==='Aguardando'?'':'none';$('bc').style.display=s==='Encerrado'?'':'none'};$('ns').onchange=tg;tg();
 $('add').onclick=()=>{const v=i=>$(i).value.trim(),o=data.find(x=>x.id===st.sel),s=$('ns').value;
  if(!v('uw')||!v('nt')){alert('Informe quem atualizou e a observação.');return}
  if(s==='Encerrado'&&(!v('cr')||!v('cv')||!v('ca'))){alert('Para encerrar, informe o horário de restabelecimento, quem validou e a ação realizada.');return}
  me=v('uw');o.s=s;if($('nc'))o.clients=+$('nc').value||0;const e={t:Date.now(),who:me,s,txt:v('nt')};
  if(s==='Aguardando'){o.wait=$('nw').value;e.why=o.wait}
  if(s==='Encerrado')o.close={restored:new Date($('cr').value).getTime(),method:$('cm').value,validator:v('cv'),action:v('ca')};
  o.log.push(e);save();render()}}

const mini=o=>`<button class="rk" data-id="${o.id}"><span class="nm">#${o.id} ${esc(o.route)}</span><span>${tag(o.s)}</span><b>${age(Date.now()-o.opened)}</b>${late(o)?'<span class="tag late">Atenção</span>':'<span></span>'}</button>`;
function vDash(){const p=pend(),n=Date.now(),lt=p.filter(late).length,cl=p.reduce((s,o)=>s+(o.type==='FTTH'?o.clients||0:0),0),w7=data.filter(o=>o.s==='Encerrado'&&n-last(o).t<7*D).length;
 const k=(v,l,c='')=>`<div class="kpi ${c}"><b>${v}</b><span>${l}</span></div>`;
 const cnt=Array.from({length:14},(_,j)=>data.filter(o=>Math.floor((n-o.opened)/D)===13-j).length),mx=Math.max(1,...cnt);

function checkAlerts(){bn();try{if(window.Notification&&Notification.permission==='granted')pend().filter(late).forEach(o=>{if(!notified[o.id]){notified[o.id]=1;new Notification(`Rompimento #${o.id}: ${late(o)}`,{body:o.route})}})}catch(e){}}
function wire(){document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{st.sel=+b.dataset.id;render()});
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{st.oc=b.dataset.q;st.view='oc';st.sel=null;render()});
 if($('win'))$('win').onchange=e=>{st.win=+e.target.value;render()};
 if($('tp'))$('tp').onchange=e=>{st.tp=e.target.value;render()};
 if($('fs'))$('fs').onchange=e=>{st.fs=e.target.value;render()};
 if($('q'))$('q').oninput=e=>{st.q=e.target.value;const p=e.target.selectionStart;render();$('q').focus();$('q').setSelectionRange(p,p)};
 wireDetail();wireNovo();wireMapa();wireEscala();wireOc()}
function render(){const T=[['dash','Dashboard'],['pend','Pendências'],['fin','Finalizados'],['mapa','Trechos'],['escala','Escala'],['oc','Ocorrências']];
 $('nav').innerHTML=T.map(t=>`<button data-v="${t[0]}" aria-current="${st.view===t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;st.sel=null;render()});
 $('app').innerHTML=({dash:vDash,pend:vPend,fin:vFin,mapa:vMapa,escala:vEscala,oc:vOc,novo:vNovo})[st.view]();bn();wire()}

render();
